<!--definindo que odocumento é em HTML e que a língua é em português-->
<!DOCTYPE html>
<html lang="pt-br">
<head> <!--cabeçalho do código; essas informações não aparecem diretamente na página, mas servem para o navegador e todos os mecanismos de busca-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS_Manuella</title> <!--define o título da aba do navegador-->
    <!--Declaração do CSS interno-->
    <style> /*tag que usamos para definir os estilos que queremos para o CSS*/
        body /*o que aplica estilos para todo o corpo da página*/
        {
    /*--estilizando o corpo da página e definindo a cor de fundo dela*/
            background-color: rgb(200, 236, 244); /*define a cor de fundo*/
        }
        H1{ /*título principal da página*/ /*ajeitando as cores e alinhando o texto da página*/
            background-color: rgb(154, 11, 63);color: white; font-size: 40px; /*cor de fundo da caixa de texto*/
            text-align: center; /*alinhando o texto*/
        }
        p{ /*definindo o tamanho e cor da fonte do título e centralizando o texto*/
            font-size: 25px; 
            text-align: center;

        } 
        h2:hover{ /*o hover serve para quando o usuário passar o mouse pelo título, a cor irá mudar*/
            color: rgb(9, 169, 233);
        }
        h2{/*centralizando os parágrafos secundários*/
            text-align: center;
        }
    </style>
</head>
<body> 
    <h1>Manuella Hansen Litoldo</h1> <!--título principal da página-->
    <p style="font-size: 25px; text-align: center;">Estudante de Desenvolvimento de Sistemas</p> <!--alterando tamanho e centralizando o subtítulo-->
    <h2 style="color: rgb(165, 0, 60);">Bem-vinda(o) à minha página!</h2> <!--alterando cor e estilizando esse título secundário-->
        <ul>
        </ul><!--fechamento da lista-->
</body> <!--fechamento do corpo da página-->
</html> <!--fechamento do documento HTML-->
